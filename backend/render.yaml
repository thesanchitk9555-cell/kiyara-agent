services:
  - type: web
    name: kiyara-backend
    runtime: docker
    repo: https://github.com/yourusername/kiyara-agent
    plan: free
    envVars:
      - key: VIDEOSDK_API_KEY
        sync: false
      - key: VIDEOSDK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./kiyara.db
    healthCheckPath: /